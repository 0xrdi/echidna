<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="serpent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4c1d95;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bg)" stroke="#2d1b69" stroke-width="2" />

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#4c1d95" stroke-width="1" opacity="0.5" />

  <!-- Coiled serpent body -->
  <path d="M 100 30
           C 140 30, 165 55, 165 85
           C 165 115, 145 140, 120 145
           C 95 150, 70 135, 65 110
           C 60 85, 75 65, 95 62
           C 115 59, 130 72, 132 90
           C 134 108, 120 120, 105 118
           C 90 116, 82 105, 85 93"
        fill="none"
        stroke="url(#serpent)"
        stroke-width="8"
        stroke-linecap="round"
        filter="url(#glow)" />

  <!-- Serpent head -->
  <path d="M 85 93
           L 78 85
           L 72 90
           L 85 93 Z"
        fill="#a78bfa"
        filter="url(#glow)" />

  <!-- Forked tongue -->
  <line x1="72" y1="90" x2="64" y2="84" stroke="#c4b5fd" stroke-width="1.5" stroke-linecap="round" />
  <line x1="72" y1="90" x2="66" y2="94" stroke="#c4b5fd" stroke-width="1.5" stroke-linecap="round" />

  <!-- Eye -->
  <circle cx="80" cy="87" r="2" fill="#22d3ee" filter="url(#glow)" />

  <!-- Scale texture -->
  <path d="M 100 30
           C 140 30, 165 55, 165 85
           C 165 115, 145 140, 120 145
           C 95 150, 70 135, 65 110
           C 60 85, 75 65, 95 62
           C 115 59, 130 72, 132 90
           C 134 108, 120 120, 105 118
           C 90 116, 82 105, 85 93"
        fill="none"
        stroke="#c4b5fd"
        stroke-width="1"
        stroke-dasharray="3 12"
        opacity="0.4" />

  <!-- Tail tip -->
  <path d="M 100 30 C 95 22, 88 20, 82 25"
        fill="none"
        stroke="url(#serpent)"
        stroke-width="4"
        stroke-linecap="round"
        filter="url(#glow)" />

  <!-- Name -->
  <text x="100" y="178" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#a78bfa" text-anchor="middle" letter-spacing="3">ECHIDNA</text>
</svg>
